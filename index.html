<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para mi San Valentín</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="card">
        <h1>¿Quieres ser mi San Valentín? ❤️</h1>
        <p>Prometo que te amare mucho ❤️</p>
        
        <div class="buttons">
            <button id="yesBtn">¡SÍ!</button>
            <button id="noBtn">No</button>
        </div>
    </div>

    <script>
        const noBtn = document.getElementById('noBtn');
        const yesBtn = document.getElementById('yesBtn');

        noBtn.addEventListener('mouseover', () => {
            const x = Math.random() * (window.innerWidth - noBtn.offsetWidth);
            const y = Math.random() * (window.innerHeight - noBtn.offsetHeight);
            
            noBtn.style.position = 'fixed'; // 'fixed' para que se mueva por toda la pantalla
            noBtn.style.left = x + 'px';
            noBtn.style.top = y + 'px';
        });

        yesBtn.addEventListener('click', () => {
            document.body.innerHTML = `
                <div class="card">
                    <h1>¡SIII! Sabía que aceptarías 😍</h1>
                    <img src="https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExOHp6Znd6Znd6Znd6Znd6Znd6Znd6Znd6Znd6Znd6Znd6Znd6JmVwPXYxX2ludGVybmFsX2dpZl9ieV9pZCZjdD1n/KztT2c4u8mYYUiMKdJ/giphy.gifhttps://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExOHp6Znd6Znd6Znd6Znd6Znd6Znd6Znd6Znd6Znd6Znd6Znd6JmVwPXYxX2ludGVybmFsX2dpZl9ieV9pZCZjdD1n/KztT2c4u8mYYUiMKdJ/giphy.gif" alt="Corgi tierno" class="img">
                    <p>¡Te amo mi San Valentín! ❤️</p>
                    <button id="BotonBtn">click</button>
                </div>
            `;
        const BotonBtn = document.getElementById('BotonBtn');
        BotonBtn.addEventListener('click', () => {
            document.body.innerHTML = `
                <div class="card">
                    <h1>¡Eres lo mejor de mi vida! ❤️</h1>
                    <img src="bb.jpeg" alt="Imagen final" style="width:250px; border-radius:15px; box-shadow: 0 4px 8px rgba(0,0,0,0.2);">
                    <p>Gracias por hacerme el más feliz.</p>
                </div>
            `;
            });
        });
    </script>
</body>
</html>
